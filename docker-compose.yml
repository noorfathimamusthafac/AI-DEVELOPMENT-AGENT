version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devagent-backend
    ports:
      - "8000:8000"
    environment:
      - OPENPROJECT_MOCK_MODE=true
      - TARGET_REPO_PATH=/app/test-repository
    volumes:
      - ./backend/dev_agent.db:/app/dev_agent.db
      - ./test-repository:/app/test-repository
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devagent-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
